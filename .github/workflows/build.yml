name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK}" >> "${GITHUB_ENV}"
          MANAGER="$(find "${SDK}/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "${MANAGER}"
          yes | "${MANAGER}" --sdk_root="${SDK}" --licenses >/dev/null || true
          "${MANAGER}" --sdk_root="${SDK}" "platforms;android-37.2" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and assemble the sideload APK
        run: ./gradlew :core:test :app:assembleRelease exportApk --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: carry-apk
          path: dist/carry.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    concurrency:
      group: carry-apk-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: carry-apk
          path: dist

      - name: Publish carry.apk
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Carry ${TAG}"
            FLAGS=(--latest)
          else
            TAG="continuous"
            TITLE="Carry continuous"
            FLAGS=(--prerelease --latest=false)
          fi
          VERSION_NAME=$(sed -n 's/^appVersion = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          VERSION_CODE=$(sed -n 's/^appVersionCode = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          NOTES="versionName: ${VERSION_NAME}
          versionCode: ${VERSION_CODE}

          Built from ${GITHUB_SHA}.

          Sideload build. Signed with the public key in app/carry-sideload.jks so a phone can install an update over the last copy. This is not a Play Store signature.

          Install on a phone that already trusts your computer:

              adb install -r carry.apk

          Or open Carry, then Settings, then Update Carry. The same file name is replaced on every build of this tag, so the download address stays put."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}" "${FLAGS[@]}"
          else
            gh release create "${TAG}" --title "${TITLE}" --notes "${NOTES}" "${FLAGS[@]}"
          fi
          gh release upload "${TAG}" dist/carry.apk --clobber
